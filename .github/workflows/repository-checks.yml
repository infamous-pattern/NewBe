name: Repository Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository:
    name: Repository integrity
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reject executable non-script files
        shell: bash
        run: |
          status=0

          while IFS= read -r file; do
            case "$file" in
              scripts/*.sh)
                ;;
              *)
                echo "Unexpected executable file: $file"
                status=1
                ;;
            esac
          done < <(git ls-files --stage |
            awk '$1 ~ /^1007/ {print $4}')

          exit "$status"

      - name: Check for whitespace errors
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check --cached
          fi

      - name: Verify required files
        shell: bash
        run: |
          required=(
            README.md
            SECURITY.md
            CONTRIBUTING.md
            CHANGELOG.md
            gtk-3.0/gtk.css
            gtk-4.0/gtk.css
            icons/NewBe/index.theme
            scripts/install.sh
            scripts/uninstall.sh
            scripts/newbe-audit.sh
          )

          for file in "${required[@]}"; do
            if [[ ! -e "$file" ]]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done
