<svg xmlns="http://www.w3.org/2000/svg"
     width="256"
     height="256"
     viewBox="0 0 256 256">

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3cf62"/>
      <stop offset=".5" stop-color="#d6a928"/>
      <stop offset="1" stop-color="#a77a12"/>
    </linearGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f5f2"/>
      <stop offset=".5" stop-color="#bfc1bc"/>
      <stop offset="1" stop-color="#777a75"/>
    </linearGradient>

    <filter id="shadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="160%">
      <feDropShadow
          dx="0"
          dy="8"
          stdDeviation="7"
          flood-opacity=".24"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">

    <!-- Folder body -->

    <path d="M27 62h72l17 20h111c9 0 16 7 16 16v112c0 10-8 18-18 18H31c-10 0-18-8-18-18V78c0-9 7-16 16-16z"
          fill="url(#gold)"
          stroke="#79570b"
          stroke-width="4"/>

    <path d="M28 111h200v96c0 8-6 14-14 14H42c-8 0-14-6-14-14z"
          fill="url(#gold)"
          stroke="#79570b"
          stroke-width="4"/>

    <!-- Network emblem plate -->

    <circle cx="128"
            cy="163"
            r="43"
            fill="url(#metal)"
            stroke="#666863"
            stroke-width="4"/>

    <!-- Network links -->

    <path d="M128 163L101 143
             M128 163L155 143
             M128 163L101 184
             M128 163L155 184"
          fill="none"
          stroke="#777a75"
          stroke-width="6"
          stroke-linecap="round"/>

    <!-- Network nodes -->

    <g fill="#d6a928"
       stroke="#79570b"
       stroke-width="3">

      <circle cx="101" cy="143" r="9"/>
      <circle cx="155" cy="143" r="9"/>
      <circle cx="101" cy="184" r="9"/>
      <circle cx="155" cy="184" r="9"/>
      <circle cx="128" cy="163" r="11"/>

    </g>

    <!-- Highlight -->

    <circle cx="124"
            cy="159"
            r="4"
            fill="#fff0a0"/>

  </g>
</svg>
