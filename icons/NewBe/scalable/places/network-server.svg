<svg xmlns="http://www.w3.org/2000/svg"
     width="256"
     height="256"
     viewBox="0 0 256 256">

  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f4f2"/>
      <stop offset=".45" stop-color="#bfc1bc"/>
      <stop offset="1" stop-color="#777a75"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0ca56"/>
      <stop offset=".5" stop-color="#d6a928"/>
      <stop offset="1" stop-color="#a77a12"/>
    </linearGradient>

    <filter id="shadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="160%">
      <feDropShadow
          dx="0"
          dy="7"
          stdDeviation="6"
          flood-opacity=".24"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">

    <!-- Network links -->

    <path d="M128 126L68 75"
          fill="none"
          stroke="#777a75"
          stroke-width="12"
          stroke-linecap="round"/>

    <path d="M128 126L188 75"
          fill="none"
          stroke="#777a75"
          stroke-width="12"
          stroke-linecap="round"/>

    <path d="M128 126L72 190"
          fill="none"
          stroke="#777a75"
          stroke-width="12"
          stroke-linecap="round"/>

    <path d="M128 126L184 190"
          fill="none"
          stroke="#777a75"
          stroke-width="12"
          stroke-linecap="round"/>

    <!-- Outer nodes -->

    <rect x="39"
          y="41"
          width="60"
          height="55"
          rx="10"
          fill="url(#metal)"
          stroke="#555752"
          stroke-width="5"/>

    <rect x="157"
          y="41"
          width="60"
          height="55"
          rx="10"
          fill="url(#metal)"
          stroke="#555752"
          stroke-width="5"/>

    <rect x="43"
          y="166"
          width="60"
          height="55"
          rx="10"
          fill="url(#metal)"
          stroke="#555752"
          stroke-width="5"/>

    <rect x="153"
          y="166"
          width="60"
          height="55"
          rx="10"
          fill="url(#metal)"
          stroke="#555752"
          stroke-width="5"/>

    <!-- Small status lights -->

    <circle cx="85" cy="81" r="6"
            fill="#d6a928"
            stroke="#79570b"
            stroke-width="2"/>

    <circle cx="203" cy="81" r="6"
            fill="#d6a928"
            stroke="#79570b"
            stroke-width="2"/>

    <circle cx="89" cy="206" r="6"
            fill="#d6a928"
            stroke="#79570b"
            stroke-width="2"/>

    <circle cx="199" cy="206" r="6"
            fill="#d6a928"
            stroke="#79570b"
            stroke-width="2"/>

    <!-- Central hub -->

    <circle cx="128"
            cy="126"
            r="43"
            fill="url(#gold)"
            stroke="#79570b"
            stroke-width="5"/>

    <circle cx="128"
            cy="126"
            r="24"
            fill="#2d2f2b"
            stroke="#5b5d58"
            stroke-width="4"/>

    <!-- Hub activity LEDs -->

    <circle cx="116"
            cy="126"
            r="5"
            fill="#f4d764"/>

    <circle cx="132"
            cy="126"
            r="5"
            fill="#d6a928"/>

    <circle cx="148"
            cy="126"
            r="5"
            fill="#9ecf55"/>

  </g>
</svg>
